<!DOCTYPE html><!-- CaçambaSP Portal do Fornecedor v0.1 (homologação) -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="theme-color" content="#05070f">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CaçambaSP">
<title>Portal do Fornecedor — CaçambaSP</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<style>
:root {
  --bg:#05070f; --sur:#0a0d1a; --card:#0f1220; --bor:rgba(80,160,255,.12); --bor2:rgba(80,160,255,.22);
  --txt:#e8f4ff; --mut:#4a6fa8; --mut2:#2a4060;
  --acc:#ffa800; --acc2:rgba(255,168,0,.1); --acc3:rgba(255,168,0,.25);
  --g:#00ffa0; --g2:rgba(0,255,160,.1); --g3:rgba(0,255,160,.25);
  --r:#ff3c5a; --r2:rgba(255,60,90,.1); --r3:rgba(255,60,90,.25);
  --b:#4090ff; --b2:rgba(64,144,255,.1); --b3:rgba(64,144,255,.25);
  --cyan:#00c8ff; --cyan2:rgba(0,200,255,.1);
  --wa:rgba(37,211,102,.15); --wa-c:#25d366; --wa-b:rgba(37,211,102,.35);
  --rad:18px; --rad2:14px; --rad3:10px;
  --font:'Plus Jakarta Sans',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:var(--font);}
button,select,input{font-family:var(--font)}
::-webkit-scrollbar{width:0}

.wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  background:var(--sur);border-bottom:1px solid var(--bor);
  padding:16px 18px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:10;
}
.topbar .who{display:flex;align-items:center;gap:10px;}
.topbar .back{
  cursor:pointer;color:var(--txt);font-size:13px;font-weight:700;padding:8px 14px;
  border-radius:20px;background:linear-gradient(180deg,#161a2c,#0d101c);
  border:1px solid var(--bor2);box-shadow:0 2px 8px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.04);
  display:flex;align-items:center;gap:5px;transition:.15s;
}
.topbar .back:active{transform:scale(.95);background:#0a0d1a;}
.topbar .mark{width:36px;height:36px;border-radius:10px;background:var(--acc2);border:1px solid var(--acc3);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--acc);font-size:14px;flex-shrink:0;}
.topbar .name b{display:block;font-size:15px;font-weight:700;}
.topbar .name span{font-size:11px;color:var(--mut);font-family:var(--mono);letter-spacing:.4px;}

.tabs{display:flex;gap:6px;padding:10px 16px;background:var(--sur);border-bottom:1px solid var(--bor);overflow-x:auto;}
.tab{
  flex:1;text-align:center;padding:9px 6px;border-radius:var(--rad3);font-size:11.5px;font-weight:700;
  color:var(--mut);background:transparent;border:1px solid transparent;cursor:pointer;
  text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;
}
.tab.active{background:linear-gradient(180deg,#161a2c,#0d101c);color:var(--acc);border-color:var(--acc3);box-shadow:0 2px 8px rgba(0,0,0,.3), inset 0 0 0 1px rgba(255,168,0,.15);}
.tab .n{margin-left:4px;opacity:.7;}

.content{flex:1;padding:16px;padding-bottom:40px;}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:60px 20px;line-height:1.6;}

.card{
  background:var(--card);border:1px solid var(--bor);border-radius:var(--rad2);
  padding:14px 15px;margin-bottom:12px;cursor:pointer;position:relative;
  border-left:3px solid var(--acc);
}
.card.b{border-left-color:var(--b);}
.card.g{border-left-color:var(--g);}
.card .id{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.3px;}
.card .addr{font-size:13px;color:var(--txt);opacity:.85;margin-top:4px;line-height:1.4;}
.card .meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.pill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;font-family:var(--mono);letter-spacing:.3px;}
.pill.acc{background:var(--acc2);color:var(--acc);}
.pill.g{background:var(--g2);color:var(--g);}
.pill.r{background:var(--r2);color:var(--r);}
.pill.b{background:var(--b2);color:var(--b);}

.badge-novo{position:absolute;top:-8px;right:12px;background:var(--acc);color:#1a1200;font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:20px;letter-spacing:.4px;}
.receipt-link{display:inline-block;margin-top:8px;font-size:12px;color:var(--acc);text-decoration:underline;cursor:pointer;}
.section-title{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px;font-weight:700;font-family:var(--mono);}

/* decisão */
.detail-box{background:var(--card);border:1px solid var(--bor);border-radius:var(--rad2);padding:16px;margin-bottom:14px;}
.info-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bor);font-size:13px;}
.info-row:last-child{border-bottom:none;}
.info-row span:first-child{color:var(--mut);}
.info-row span:last-child{font-weight:600;text-align:right;}

.field-label{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px;font-weight:700;font-family:var(--mono);}
select,textarea{
  width:100%;background:var(--sur);border:1px solid var(--bor2);color:var(--txt);
  padding:12px 14px;border-radius:var(--rad3);font-size:14px;
}
textarea{resize:vertical;min-height:70px;}

.btn-row{display:flex;gap:10px;padding:14px 16px 22px;border-top:1px solid var(--bor);background:var(--sur);position:sticky;bottom:0;}
.btn{flex:1;padding:14px 10px;border-radius:var(--rad3);border:none;font-size:13.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;cursor:pointer;transition:.15s;}
.btn-accept{background:linear-gradient(180deg,#ffc247,var(--acc));color:#1a1200;box-shadow:0 4px 14px rgba(255,168,0,.35), inset 0 1px 0 rgba(255,255,255,.3);}
.btn-accept:active{transform:scale(.97);box-shadow:0 2px 6px rgba(255,168,0,.25);}
.btn-reject{background:linear-gradient(180deg,#161a2c,#0d101c);color:var(--txt);border:1px solid var(--bor2);box-shadow:inset 0 1px 0 rgba(255,255,255,.04);}
.btn-reject:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(180deg,#ffc247,var(--acc));color:#1a1200;width:100%;box-shadow:0 4px 14px rgba(255,168,0,.35), inset 0 1px 0 rgba(255,255,255,.3);}
.btn-primary:active{transform:scale(.98);}
.btn:disabled{opacity:.5;}

.timeline{position:relative;padding-left:20px;margin-bottom:8px;}
.tl-item{position:relative;padding-bottom:16px;}
.tl-item::before{content:'';position:absolute;left:-20px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--acc);}
.tl-item::after{content:'';position:absolute;left:-16px;top:12px;bottom:-6px;width:1px;background:var(--bor2);}
.tl-item:last-child::after{display:none;}
.tl-time{font-size:10.5px;color:var(--mut);font-family:var(--mono);}
.tl-text{font-size:13px;margin-top:2px;}

.followup-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;}
.fu-opt{background:var(--sur);border:1px solid var(--bor2);border-radius:var(--rad3);padding:12px 8px;text-align:center;font-size:12px;color:var(--mut);font-weight:600;cursor:pointer;}
.fu-opt.sel{border-color:var(--acc);color:var(--acc);background:var(--acc2);}

.pay-hero{background:var(--card);border:1px solid var(--bor);border-radius:var(--rad);padding:20px;margin-bottom:16px;}

.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-top:6px;}
.dash-tile{
  position:relative;aspect-ratio:1/1;
  background:linear-gradient(155deg,#141830,var(--card) 55%);
  border:1px solid var(--bor2);
  border-radius:var(--rad);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;cursor:pointer;transition:.15s;
  box-shadow:0 6px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);
}
.dash-tile:active{transform:scale(.96);box-shadow:0 2px 8px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.05);}
.dash-tile .dt-ic{font-size:34px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));}
.dash-tile .dt-label{font-size:13px;font-weight:700;color:var(--txt);text-align:center;padding:0 8px;}
.dash-tile .dt-sub{font-size:10.5px;color:var(--mut);font-family:var(--mono);}
.dash-badge{
  position:absolute;top:-8px;right:-8px;min-width:26px;height:26px;border-radius:20px;
  background:linear-gradient(180deg,#ffc247,var(--acc));color:#1a1200;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;
  padding:0 7px;border:3px solid var(--bg);box-shadow:0 2px 8px rgba(255,168,0,.5);
}
.dash-badge.g{background:linear-gradient(180deg,#4dffc0,var(--g));box-shadow:0 2px 8px rgba(0,255,160,.4);}
.dash-header{padding:4px 2px 14px;}
.dash-header b{font-size:19px;display:block;}
.dash-header span{font-size:12px;color:var(--mut);}
.capture-row{display:flex;gap:10px;margin:12px 0 4px;}
.cap-btn{flex:1;background:linear-gradient(155deg,#141830,var(--sur) 60%);border:1px dashed var(--bor2);border-radius:var(--rad3);padding:16px 8px;text-align:center;font-size:12px;color:var(--txt);font-weight:600;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.04);}
.cap-btn .ic{font-size:20px;display:block;margin-bottom:6px;}
.cap-btn.active{border:1px solid var(--acc);color:var(--acc);background:var(--acc2);}
.cap-btn.done{border:1px solid var(--g);color:var(--g);background:var(--g2);}
#mapaLC{width:100%;height:180px;border-radius:var(--rad2);border:1px solid var(--bor);margin-bottom:14px;overflow:hidden;background:var(--card);}
.pay-hero .lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-family:var(--mono);}
.pay-hero .val{font-size:32px;font-weight:800;color:var(--acc);margin-top:4px;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--bor2);
  padding:12px 20px;border-radius:20px;font-size:13px;z-index:100;opacity:0;transition:.2s;pointer-events:none;}
.toast.show{opacity:1;bottom:30px;}

.loading{display:flex;align-items:center;justify-content:center;height:60vh;color:var(--mut);font-family:var(--mono);font-size:12px;}
.gate{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:30px;text-align:center;}
.gate .ic{font-size:40px;margin-bottom:14px;}
.gate h2{font-size:16px;margin:0 0 8px;}
.gate p{font-size:13px;color:var(--mut);line-height:1.5;}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="loading">carregando…</div>
</div>

<div class="toast" id="toast"></div>

<script>
// Aponta o manifest pra edge function, que gera o JSON com o start_url
// certo pra esse fornecedor. URL de verdade (nao blob local) - o Chrome
// reconhece com mais confianca pra liberar a instalacao.
(function(){
  const params = new URLSearchParams(location.search);
  const token = params.get('t') || '';
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = 'https://ejfuqijtiberxsnvxdwm.supabase.co/functions/v1/portal-manifest?t=' + encodeURIComponent(token);
  document.head.appendChild(link);
})();
</script>
<script>
const SUPA_URL = 'https://ejfuqijtiberxsnvxdwm.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqZnVxaWp0aWJlcnhzbnZ4ZHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2MTMyMzYsImV4cCI6MjA4OTE4OTIzNn0.14Ba8klx6YkPT5UrZ2eB5cYWdSKcBOCl4mdEgfmXqaU';

async function api(path, method='GET', body=null, extraHeaders={}){
  const h = {'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY, ...extraHeaders};
  const r = await fetch(SUPA_URL+'/rest/v1/'+path, {method, headers:h, body: body?JSON.stringify(body):null});
  if(!r.ok){ const t = await r.text(); throw new Error('API '+r.status+': '+t); }
  const ct = r.headers.get('content-type')||'';
  return ct.includes('json') ? r.json() : null;
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

let FORN = null;
let ORDENS = [];
let VIEW = 'home';
let ACTIVE_LC = null;
let FU_TIPO = 'chegada_ok';

let TOKEN = null;
let _installEvent = null;
let _jaInstalado = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  _installEvent = e;
  _mostrarBannerInstalar();
});

function _isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }

function _mostrarBannerInstalar(){
  if(_jaInstalado || document.getElementById('bannerInstalar')) return;
  const b = document.createElement('div');
  b.id = 'bannerInstalar';
  b.style.cssText = 'position:sticky;top:0;z-index:20;background:var(--acc);color:#1a1200;padding:10px 16px;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px;';
  if(_isIOS()){
    b.innerHTML = `<span>📲 Toque em <b>Compartilhar</b> e depois em <b>"Adicionar à Tela de Início"</b> pra ter o app aqui</span><span onclick="this.parentNode.remove()" style="cursor:pointer;font-size:16px">✕</span>`;
  } else {
    b.innerHTML = `<span>📲 Instale o app na tela inicial do seu celular</span><span style="display:flex;gap:10px;align-items:center"><button onclick="_instalarApp()" style="background:#1a1200;color:var(--acc);border:none;padding:6px 12px;border-radius:8px;font-weight:700;cursor:pointer">Instalar</button><span onclick="this.parentNode.parentNode.remove()" style="cursor:pointer;font-size:16px">✕</span></span>`;
  }
  document.body.insertBefore(b, document.body.firstChild);
}

async function _instalarApp(){
  if(!_installEvent) return;
  _installEvent.prompt();
  await _installEvent.userChoice;
  _installEvent = null;
  const banner = document.getElementById('bannerInstalar');
  if(banner) banner.remove();
}

async function boot(){
  const params = new URLSearchParams(location.search);
  TOKEN = params.get('t');
  const app = document.getElementById('app');

  if(!TOKEN){
    app.innerHTML = gateHTML('🔗','Link inválido','Esse link não tem o código do fornecedor. Confira o link que você recebeu.');
    return;
  }

  try{
    const forns = await api('rpc/portal_get_fornecedor', 'POST', { p_token: TOKEN });
    if(!forns.length){
      app.innerHTML = gateHTML('❌','Link não encontrado','Esse link não corresponde a nenhum fornecedor ativo.');
      return;
    }
    FORN = forns[0];
    if(FORN.portal_ativo === false){
      app.innerHTML = gateHTML('⏸️','Acesso desativado','Fale com a CaçambaSP para reativar seu acesso.');
      return;
    }
    await loadOrdens();
    render();
    if(_isIOS() && !_jaInstalado) setTimeout(_mostrarBannerInstalar, 800);
    initNotificacoes();
    atualizarBadge();
  }catch(e){
    app.innerHTML = gateHTML('⚠️','Erro ao carregar','Tente novamente em instantes. '+e.message);
  }
}

function gateHTML(icon,title,msg){
  return `<div class="gate"><div class="ic">${icon}</div><h2>${title}</h2><p>${msg}</p></div>`;
}

async function loadOrdens(){
  ORDENS = await api('rpc/portal_list_ordens', 'POST', { p_token: TOKEN });
  atualizarBadge();
}

function novas(){ return ORDENS.filter(o=>o.forn_status==='pendente'); }
function aceitas(){ return ORDENS.filter(o=>o.forn_status==='aceito' && !o.entrega_confirmada && !['pagar','faltapg','baixar','concluido'].includes(o.col)); }
function pagamento(){ return ORDENS.filter(o=>['pagar','faltapg','concluido','baixar'].includes(o.col) || o.forn_pago!==undefined); }

function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="topbar">
      <div class="who">
        ${VIEW!=='home' ? `<span class="back" onclick="setView('home')">‹ Voltar</span>` : ''}
        <div class="mark">${(FORN.nome||'F').slice(0,2).toUpperCase()}</div>
        <div class="name"><b>${FORN.nome}</b><span>PORTAL DO FORNECEDOR</span></div>
      </div>
    </div>
    ${VIEW!=='home' ? `
    <div class="tabs">
      <div class="tab ${VIEW==='lista'?'active':''}" onclick="setView('lista')">Novas <span class="n">${novas().length}</span></div>
      <div class="tab ${VIEW==='rota'?'active':''}" onclick="setView('rota')">Em rota <span class="n">${aceitas().length}</span></div>
      <div class="tab ${VIEW==='pagamento'?'active':''}" onclick="setView('pagamento')">Pagamentos</div>
      <div class="tab ${VIEW==='relatorios'?'active':''}" onclick="setView('relatorios')">Relatórios</div>
    </div>` : ''}
    <div class="content" id="content"></div>
  `;
  renderContent();
}

function setView(v){ VIEW=v; ACTIVE_LC=null; render(); }
function abrirDecisao(id){ VIEW='decisao'; ACTIVE_LC=ORDENS.find(o=>o.id===id); render(); }
function abrirFollowup(id){ VIEW='followup'; ACTIVE_LC=ORDENS.find(o=>o.id===id); MIDIA_PATH=null; MIDIA_TIPO=null; render(); }

function renderContent(){
  const c = document.getElementById('content');
  if(ACTIVE_LC && VIEW==='decisao'){ renderDecisao(ACTIVE_LC); return; }
  if(ACTIVE_LC && VIEW==='followup'){ renderFollowup(ACTIVE_LC); return; }

  if(VIEW==='home'){
    const nNovas = novas().length;
    const nRota = aceitas().length;
    const nPag = ORDENS.filter(o=>o.forn_id && o.forn_status!=='pendente' && !o.forn_pago).length;
    c.innerHTML = `
      <div class="dash-header"><b>Olá, ${(FORN.nome||'').split(' ')[0]}</b><span>O que você quer fazer agora?</span></div>
      <div class="dash-grid">
        <div class="dash-tile" onclick="setView('lista')">
          ${nNovas>0?`<span class="dash-badge">${nNovas}</span>`:''}
          <div class="dt-ic">📥</div>
          <div class="dt-label">Novas LCs</div>
          <div class="dt-sub">${nNovas>0?'aguardando você':'nenhuma pendente'}</div>
        </div>
        <div class="dash-tile" onclick="setView('rota')">
          ${nRota>0?`<span class="dash-badge">${nRota}</span>`:''}
          <div class="dt-ic">🚚</div>
          <div class="dt-label">Em rota</div>
          <div class="dt-sub">${nRota>0?'entregas do dia':'nenhuma em rota'}</div>
        </div>
        <div class="dash-tile" onclick="setView('pagamento')">
          ${nPag>0?`<span class="dash-badge g">${nPag}</span>`:''}
          <div class="dt-ic">💰</div>
          <div class="dt-label">Pagamentos</div>
          <div class="dt-sub">${nPag>0?'aguardando receber':'tudo em dia'}</div>
        </div>
        <div class="dash-tile" onclick="setView('relatorios')">
          <div class="dt-ic">📊</div>
          <div class="dt-label">Relatórios</div>
          <div class="dt-sub">resumo e histórico</div>
        </div>
      </div>
    `;
    return;
  }

  if(VIEW==='lista'){
    const lista = novas();
    if(!lista.length){ c.innerHTML = `<div class="empty">Nenhuma LC nova no momento.<br>Quando a CaçambaSP te atribuir uma, ela aparece aqui.</div>`; return; }
    c.innerHTML = lista.map(o=>`
      <div class="card" onclick="abrirDecisao('${o.id}')">
        <span class="badge-novo">NOVO</span>
        <div class="id">${o.crm_id}</div>
        <div class="addr">${o.logradouro||''} — ${o.bairro||''}</div>
        <div class="meta"><span class="pill acc">${o.tipo||'Caçamba'}</span></div>
      </div>
    `).join('');
  }

  if(VIEW==='rota'){
    const lista = aceitas();
    if(!lista.length){ c.innerHTML = `<div class="empty">Nenhuma LC em rota agora.</div>`; return; }
    c.innerHTML = `
      <div id="mapaLC"></div>
      ${lista.length>1?'<div style="text-align:center;margin-bottom:12px"><button class="btn btn-primary" style="width:auto;padding:10px 18px" onclick="mostrarRotaMultipla()">🧭 Traçar itinerário</button></div>':''}
      ${lista.map(o=>`
        <div class="card b">

// ── MAPA (gratuito: OpenStreetMap + Nominatim + OSRM) ──
function linkGPS(o){
  const endereco = [o.logradouro, o.bairro, o.cidade||'São Paulo'].filter(Boolean).join(', ');
  return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(endereco) + '&travelmode=driving';
}
const _geoCache = {};
let _geoFila = Promise.resolve();
function geocodar(endereco, cep){
  const chave = endereco + '|' + (cep||'');
  if(_geoCache[chave] !== undefined) return Promise.resolve(_geoCache[chave]);
  _geoFila = _geoFila.then(async ()=>{
    const resultado = await _geocodarUmaVez(endereco, cep);
    _geoCache[chave] = resultado;
    await new Promise(r=>setTimeout(r, 1100)); // Nominatim: max 1 pedido/segundo
    return resultado;
  });
  return _geoFila;
}
async function _geocodarUmaVez(endereco, cep){
  // tentativa 1: BrasilAPI pelo CEP - servico dedicado a CEP brasileiro, mais confiavel
  // e sem risco de limite de uso compartilhado que o Nominatim tem
  if(cep){
    const cepLimpo = cep.replace(/\D/g,'');
    if(cepLimpo.length===8){
      try{
        const r = await fetch(`https://brasilapi.com.br/api/cep/v2/${cepLimpo}`);
        if(r.ok){
          const data = await r.json();
          if(data && data.location && data.location.coordinates &&
             data.location.coordinates.latitude && data.location.coordinates.longitude){
            return {
              lat: parseFloat(data.location.coordinates.latitude),
              lng: parseFloat(data.location.coordinates.longitude)
            };
          }
        }
      }catch(e){}
    }
  }
  // tentativa 2 e 3: endereco por extenso no Nominatim (reserva)
  const tentativasTexto = [
    endereco + ', São Paulo, Brasil',
    endereco.split(',').slice(0,2).join(',') + ', São Paulo, Brasil'
  ];
  for(const tentativa of tentativasTexto){
    try{
      const q = encodeURIComponent(tentativa);
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q=${q}`);
      const data = await r.json();
      if(data && data[0]){
        return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
      }
    }catch(e){}
    await new Promise(res=>setTimeout(res, 1100));
  }
  // tentativa 4: CEP estruturado no Nominatim
  if(cep){
    const cepLimpo = cep.replace(/\D/g,'');
    if(cepLimpo.length===8){
      try{
        const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&postalcode=${cepLimpo}&country=Brazil`);
        const data = await r.json();
        if(data && data[0]){
          return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
        }
      }catch(e){}
    }
  }
  return null;
}

let _mapaAtual = null;
function _limparMapa(){
  if(_mapaAtual){ _mapaAtual.remove(); _mapaAtual = null; }
}

async function mostrarDistanciaBase(o){
  const el = document.getElementById('distanciaBase');
  if(!el) return;
  if(!FORN.endereco_base){ el.innerHTML = ''; return; }
  el.innerHTML = `<div class="empty" style="padding:8px 0;font-size:12px">Calculando distância da sua base...</div>`;
  try{
    let aproximado = false;

    let posBase = await geocodar(FORN.endereco_base);
    if(!posBase){
      const partesBase = FORN.endereco_base.split(',');
      if(partesBase.length>1){
        posBase = await geocodar(partesBase.slice(-2).join(','));
        if(posBase) aproximado = true;
      }
    }

    const endereco = [o.logradouro, o.bairro, o.cidade].filter(Boolean).join(', ');
    let posEntrega = await geocodar(endereco, o.cep);
    if(!posEntrega && o.bairro){
      // nao achou a rua exata - tenta so o bairro (a funcao ja completa com ", São Paulo, Brasil" sozinha)
      posEntrega = await geocodar(o.bairro);
      if(posEntrega) aproximado = true;
    }

    if(!posBase || !posEntrega){ el.innerHTML = ''; return; }
    const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${posBase.lng},${posBase.lat};${posEntrega.lng},${posEntrega.lat}?overview=false`);
    const data = await r.json();
    if(data.routes && data.routes[0]){
      const km = data.routes[0].distance/1000;
      // sanidade: entrega dentro da Grande SP nao deveria passar de ~100km.
      // Se der mais que isso na estimativa aproximada, e mais provavel erro de busca do que distancia real - melhor nao mostrar
      if(aproximado && km > 100){ el.innerHTML = ''; return; }
      const min = Math.round(data.routes[0].duration/60);
      el.innerHTML = aproximado
        ? `<div class="pill acc" style="display:inline-flex;margin-bottom:12px">📍 ~${km.toFixed(1)} km da sua base (aproximado, pelo bairro)</div>`
        : `<div class="pill b" style="display:inline-flex;margin-bottom:12px">📍 ${km.toFixed(1)} km da sua base · ~${min} min</div>`;
    } else {
      el.innerHTML = '';
    }
  }catch(e){ el.innerHTML = ''; }
}

async function mostrarMapaPino(o){
  const el = document.getElementById('mapaLC');
  if(!el || typeof L==='undefined') return;
  _limparMapa();
  const endereco = [o.logradouro, o.bairro, o.cidade].filter(Boolean).join(', ');
  const pos = await geocodar(endereco, o.cep);
  if(!pos){ el.innerHTML = '<div class="empty" style="padding:20px;line-height:1.6">📍 Esse endereço não foi localizado no mapa embutido.<br><b style="color:var(--b)">Use o botão "🧭 Abrir no GPS" acima</b> pra chegar até lá.</div>'; return; }
  _mapaAtual = L.map('mapaLC', {zoomControl:false, attributionControl:false}).setView([pos.lat, pos.lng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(_mapaAtual);
  L.marker([pos.lat, pos.lng]).addTo(_mapaAtual);
}

async function mostrarMapaMultiplo(lista){
  const el = document.getElementById('mapaLC');
  if(!el || typeof L==='undefined') return;
  _limparMapa();
  const pontos = [];
  for(const o of lista){
    const endereco = [o.logradouro, o.bairro, o.cidade].filter(Boolean).join(', ');
    const pos = await geocodar(endereco, o.cep);
    if(pos) pontos.push({...pos, crm_id:o.crm_id});
  }
  if(!pontos.length){ el.innerHTML = '<div class="empty" style="padding:20px;line-height:1.6">📍 Nenhum desses endereços foi localizado no mapa embutido.<br><b style="color:var(--b)">Use o botão "🧭 GPS" de cada LC abaixo</b> pra chegar até elas.</div>'; return; }
  _mapaAtual = L.map('mapaLC', {zoomControl:false, attributionControl:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(_mapaAtual);
  const bounds = [];
  pontos.forEach((p,i)=>{
    L.marker([p.lat,p.lng]).addTo(_mapaAtual).bindPopup((i+1)+'. '+p.crm_id);
    bounds.push([p.lat,p.lng]);
  });
  _mapaAtual.fitBounds(bounds, {padding:[30,30]});
  window._PONTOS_ROTA = pontos;
}

async function mostrarRotaMultipla(){
  const pontos = window._PONTOS_ROTA;
  if(!pontos || pontos.length<2 || !_mapaAtual) return;
  toast('Traçando itinerário...');
  try{
    const coords = pontos.map(p=>p.lng+','+p.lat).join(';');
    const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`);
    const data = await r.json();
    if(data.routes && data.routes[0]){
      const linha = data.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
      L.polyline(linha, {color:'#ffa800', weight:4}).addTo(_mapaAtual);
      toast('Itinerário traçado ✓');
    }else{ toast('Não consegui traçar a rota'); }
  }catch(e){ toast('Erro ao traçar rota'); }
}

// ── FOTO / ÁUDIO ──
let MIDIA_PATH = null, MIDIA_TIPO = null;
let _mediaRecorder = null, _audioChunks = [], _gravando = false;

function _fileParaBase64(file){
  return new Promise((res,rej)=>{
    const reader = new FileReader();
    reader.onload = ()=> res(reader.result.split(',')[1]);
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
}

async function _uploadMidia(base64, mime, tipo){
  const r = await fetch(SUPA_URL+'/functions/v1/portal-upload-midia', {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPA_KEY,'apikey':SUPA_KEY},
    body: JSON.stringify({ token: TOKEN, ordem_id: ACTIVE_LC.id, file_base64: base64, mime, tipo })
  });
  const data = await r.json();
  if(!r.ok || !data.path) throw new Error(data.error||'falha no upload');
  return data.path;
}

async function onFotoSelecionada(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const btn = document.getElementById('btnFoto');
  btn.classList.add('active');
  document.getElementById('fotoLabel').textContent = 'Enviando...';
  try{
    const base64 = await _fileParaBase64(file);
    const path = await _uploadMidia(base64, file.type||'image/jpeg', 'foto');
    MIDIA_PATH = path; MIDIA_TIPO = 'foto';
    btn.classList.remove('active'); btn.classList.add('done');
    document.getElementById('fotoLabel').textContent = 'Foto anexada ✓';
  }catch(e){
    btn.classList.remove('active');
    document.getElementById('fotoLabel').textContent = 'Foto';
    toast('Erro ao enviar foto: '+e.message);
  }
}

async function toggleGravacao(){
  if(_gravando){ _mediaRecorder.stop(); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    _audioChunks = [];
    _mediaRecorder = new MediaRecorder(stream);
    _mediaRecorder.ondataavailable = e=>_audioChunks.push(e.data);
    _mediaRecorder.onstop = async ()=>{
      stream.getTracks().forEach(t=>t.stop());
      _gravando = false;
      document.getElementById('audioIcon').textContent = '🎙️';
      document.getElementById('audioLabel').textContent = 'Enviando...';
      document.getElementById('btnAudio').classList.remove('active');
      try{
        const blob = new Blob(_audioChunks, {type:'audio/webm'});
        const base64 = await new Promise((res,rej)=>{
          const reader = new FileReader();
          reader.onload = ()=>res(reader.result.split(',')[1]);
          reader.onerror = rej;
          reader.readAsDataURL(blob);
        });
        const path = await _uploadMidia(base64, 'audio/webm', 'audio');
        MIDIA_PATH = path; MIDIA_TIPO = 'audio';
        document.getElementById('btnAudio').classList.add('done');
        document.getElementById('audioLabel').textContent = 'Áudio anexado ✓';
      }catch(e){
        document.getElementById('audioLabel').textContent = 'Áudio';
        toast('Erro ao enviar áudio: '+e.message);
      }
    };
    _mediaRecorder.start();
    _gravando = true;
    document.getElementById('audioIcon').textContent = '⏹️';
    document.getElementById('audioLabel').textContent = 'Gravando... toque p/ parar';
    document.getElementById('btnAudio').classList.add('active');
  }catch(e){
    toast('Não consegui acessar o microfone');
  }
}

// ── NOTIFICAÇÕES PUSH (OneSignal) + BADGE NO ÍCONE ──
function atualizarBadge(){
  const n = novas().length;
  navigator.serviceWorker?.ready.then(reg=>{
    reg.active?.postMessage({ type:'UPDATE_BADGE', count:n });
  }).catch(()=>{});
  if('setAppBadge' in navigator){
    n>0 ? navigator.setAppBadge(n).catch(()=>{}) : navigator.clearAppBadge().catch(()=>{});
  }
}

let _oneSignalInited = false;
async function initNotificacoes(){
  if(_oneSignalInited || !window.OneSignalDeferred) { _mostrarBannerNotificacao(); return; }
  _oneSignalInited = true;
  window.OneSignalDeferred.push(async (OneSignal)=>{
    try{
      await OneSignal.init({
        appId: 'c2dbdd20-6f19-433f-8106-f45d3e37714d',
        serviceWorkerPath: '/sw.js',
        notifyButton: { enable: false },
      });
    }catch(e){}
    try{ await OneSignal.login('forn_'+FORN.id); }catch(e){}
    if(Notification.permission === 'granted'){
      await _registrarSubscricao(OneSignal);
    } else if(Notification.permission === 'default'){
      _mostrarBannerNotificacao();
    }
  });
}

async function _registrarSubscricao(OneSignal){
  try{
    const ok = await OneSignal.User.PushSubscription.optedIn;
    if(!ok) await OneSignal.User.PushSubscription.optIn();
    await new Promise(r=>setTimeout(r,1500));
    const subId = OneSignal.User.PushSubscription.id;
    if(subId){ await api('rpc/portal_salvar_onesignal', 'POST', { p_token: TOKEN, p_onesignal_id: subId }); }
  }catch(e){}
}

function _mostrarBannerNotificacao(){
  if(document.getElementById('bannerNotif')) return;
  const b = document.createElement('div');
  b.id = 'bannerNotif';
  b.style.cssText = 'position:sticky;top:0;z-index:19;background:var(--b);color:#fff;padding:10px 16px;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px;';
  b.innerHTML = `<span>🔔 Ative as notificações pra saber quando tiver LC nova</span><span style="display:flex;gap:10px;align-items:center"><button onclick="_ativarNotificacoes()" style="background:#fff;color:var(--b);border:none;padding:6px 12px;border-radius:8px;font-weight:800;cursor:pointer">Ativar</button><span onclick="this.parentNode.parentNode.remove()" style="cursor:pointer;font-size:16px">✕</span></span>`;
  document.body.insertBefore(b, document.body.firstChild);
}

async function _ativarNotificacoes(){
  const perm = await Notification.requestPermission();
  const banner = document.getElementById('bannerNotif');
  if(banner) banner.remove();
  if(perm !== 'granted'){ toast('Permissão negada — ative depois nas configurações do celular'); return; }
  if(!window.OneSignalDeferred) return;
  window.OneSignalDeferred.push(async (OneSignal)=>{
    await _registrarSubscricao(OneSignal);
    toast('🔔 Notificações ativadas ✓');
  });
}

boot();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('/sw.js', { scope: '/portal-fornecedor.html' }).catch(()=>{});
  });
}
