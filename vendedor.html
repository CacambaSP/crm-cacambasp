<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JUCA — CaçambaSP</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sora', sans-serif; background: #f0f2f0; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #0F6E56; padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
    .logo-circle { width: 38px; height: 38px; border-radius: 50%; background: #085041; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #9FE1CB; }
    .logo-info { flex: 1; }
    .logo-name { color: #E1F5EE; font-size: 14px; font-weight: 600; }
    .logo-sub { color: #9FE1CB; font-size: 11px; }
    .ia-badge { background: rgba(255,255,255,0.15); color: #E1F5EE; font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.25); }
    .chat-wrap { flex: 1; max-width: 480px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; padding: 0 0 80px; }
    #messages { flex: 1; padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; min-height: 300px; }
    .msg { max-width: 84%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.55; }
    .msg.bot { background: #fff; color: #1a1a1a; border-bottom-left-radius: 4px; align-self: flex-start; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .msg.user { background: #1D9E75; color: #E1F5EE; border-bottom-right-radius: 4px; align-self: flex-end; }
    .msg.erro { background: #fff3cd; color: #856404; border: 1px solid #ffc107; border-radius: 10px; align-self: center; font-size: 12px; max-width: 95%; text-align: center; padding: 8px 12px; }
    .msg.sistema { background: #E1F5EE; color: #085041; border-radius: 10px; align-self: center; font-size: 12.5px; max-width: 95%; text-align: center; padding: 8px 12px; }
    .typing { display: flex; gap: 5px; align-items: center; background: #fff; padding: 12px 15px; border-radius: 18px; border-bottom-left-radius: 4px; align-self: flex-start; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .typing span { width: 8px; height: 8px; border-radius: 50%; background: #9FE1CB; animation: blink 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }
    #input-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e2e2de; padding: 10px 14px; display: flex; gap: 10px; align-items: center; z-index: 100; }
    #txt { flex: 1; border: 1px solid #ddd; border-radius: 24px; padding: 10px 16px; font-size: 14px; font-family: 'Sora', sans-serif; outline: none; background: #f4f4f0; color: #1a1a1a; }
    #txt:focus { border-color: #1D9E75; }
    #send { width: 42px; height: 42px; border-radius: 50%; background: #1D9E75; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    #send:hover { background: #0F6E56; }
    .cadastro-btn { display: block; width: calc(100% - 28px); margin: 8px 14px 0; padding: 13px; background: #1D9E75; color: #fff; border: none; border-radius: 14px; font-size: 15px; font-weight: 600; font-family: 'Sora', sans-serif; cursor: pointer; text-align: center; }
    .douglas-btn { display: block; width: calc(100% - 28px); margin: 8px 14px 0; padding: 12px; background: #fff; color: #0F6E56; border: 2px solid #1D9E75; border-radius: 14px; font-size: 14px; font-weight: 600; font-family: 'Sora', sans-serif; cursor: pointer; text-align: center; }
    .footer-note { text-align: center; font-size: 11px; color: #aaa; padding: 8px 14px 16px; }
    .aprender-link { display: none; text-align: center; font-size: 12px; color: #0F6E56; text-decoration: underline; cursor: pointer; background: none; border: none; font-family: 'Sora', sans-serif; padding: 4px 0 12px; width: 100%; }
    .aprender-link.visivel { display: block; }
    #aprender-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end; justify-content: center; }
    #aprender-modal.open { display: flex; }
    .modal-box { background: #fff; border-radius: 20px 20px 0 0; padding: 24px 20px 32px; width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; }
    .modal-title { font-size: 16px; font-weight: 600; }
    .modal-sub { font-size: 13px; color: #666; line-height: 1.5; }
    .modal-box textarea { border: 1px solid #ddd; border-radius: 12px; padding: 12px; font-size: 14px; font-family: 'Sora', sans-serif; resize: none; height: 100px; outline: none; color: #1a1a1a; }
    .modal-box textarea:focus { border-color: #1D9E75; }
    .modal-btns { display: flex; gap: 8px; }
    .btn-salvar { flex: 1; padding: 11px; background: #1D9E75; color: #fff; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; font-family: 'Sora', sans-serif; cursor: pointer; }
    .btn-cancelar { padding: 11px 18px; background: #f4f4f0; color: #666; border: none; border-radius: 12px; font-size: 14px; font-family: 'Sora', sans-serif; cursor: pointer; }
    .admin-bar { display: none; background: #085041; color: #9FE1CB; text-align: center; font-size: 11px; padding: 4px; font-family: 'Sora', sans-serif; }
    .admin-bar.visivel { display: block; }
  </style>
</head>
<body>

<div class="admin-bar" id="admin-bar">🔐 Modo Admin — Douglas</div>

<header>
  <div class="logo-circle">JU</div>
  <div class="logo-info">
    <div class="logo-name">JUCA · CaçambaSP</div>
    <div class="logo-sub">Assistente de IA — JUnior CAçamba</div>
  </div>
  <div class="ia-badge">🤖 IA</div>
</header>

<div class="chat-wrap">
  <div id="messages"></div>
</div>

<div id="input-bar">
  <input id="txt" type="text" placeholder="Digite aqui..."/>
  <button id="send" onclick="enviar()" aria-label="Enviar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M22 2L11 13" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<div id="aprender-modal">
  <div class="modal-box">
    <div class="modal-title">📚 Ensinar o JUCA</div>
    <div class="modal-sub">Douglas, escreva a resposta correta. O JUCA vai usar nas próximas conversas.</div>
    <textarea id="aprender-txt" placeholder="Ex: Em Osasco não emitimos CTR, então o prazo é mais flexível..."></textarea>
    <div class="modal-btns">
      <button class="btn-cancelar" onclick="fecharAprender()">Cancelar</button>
      <button class="btn-salvar" onclick="salvarAprendizado()">Salvar</button>
    </div>
  </div>
</div>

<script>
const EMPRESA   = 'CaçambaSP';
const CADASTRO  = 'https://cacambasp-crm.vercel.app/cadastro.html?v=6b691e8b-b9e8-4fe7-959a-ee04f03f0803';
const DOUGLAS   = '551142378757';
const ADMIN_KEY = '5488141';
const STORAGE_KEY = 'juca_aprendizados_v2';

/* ── Detectar modo admin ── */
const urlParams = new URLSearchParams(window.location.search);
const isAdmin = urlParams.get('admin') === ADMIN_KEY;
if (isAdmin) {
  document.getElementById('admin-bar').classList.add('visivel');
}

/* ── Aprendizados ── */
function getAprendizados() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); } catch { return []; } }
function setAprendizados(l) { localStorage.setItem(STORAGE_KEY, JSON.stringify(l)); }
function aprendizadosTexto() {
  const l = getAprendizados();
  return l.length ? '\n\n═══ APRENDIZADOS DO DOUGLAS ═══\n' + l.map((a,i)=>`${i+1}. ${a}`).join('\n') : '';
}

/* ── System prompt ── */
function buildSystem() {
  return `Você é JUCA (JUnior CAçamba), assistente de IA da ${EMPRESA}. Simpático, direto, experiente.
Sempre deixe claro que é IA. O gerente humano é o Douglas.

FLUXO OBRIGATÓRIO — siga esta ordem exata, uma pergunta por vez:
1. Perguntar o NOME do cliente
2. Perguntar o WHATSAPP com DDD
3. Perguntar o BAIRRO ou CIDADE
4. Confirmar atendimento e informar entrega durante o dia
5. Perguntar TIPO DE RESÍDUO (entulho, poda, lixo, etc.)
6. Perguntar se precisa de NF
7. Apresentar PROPOSTA COMPLETA com preço correto
8. Cliente aceita → encaminhar para cadastro

PREÇOS (nunca fale antes de confirmar o bairro):
- Osasco, Carapicuíba, Grande SP → R$ 430 sem NF / R$ 470 com NF
- SP Zona Norte, Sul, Zona Oeste, Barueri → R$ 530 / R$ 570
- SP Zona Leste, Perus, Pirituba → R$ 560 / R$ 600

PRODUTO: Caçamba 4m³ · Entrega durante o dia

REGRAS DE PRAZO:
- São Paulo e maioria das cidades → 3 dias (lei municipal — CTR, multa se ultrapassar)
- Osasco → NÃO emite CTR. Prazo mais flexível, combinar com Douglas.
- Prazo maior não é vantagem: vizinhos jogam lixo e cliente perde capacidade paga.

PAGAMENTO: Só PIX após entrega. Motorista não recebe (segurança). Sem dinheiro ou cartão.

GOLPES: Se citar preço abaixo de R$400 ou entrega em 2h → "💣💣💣⚡⚡ Cuidado! Valor de R$230 não existe. Entrega em 2h é sinal de golpe. A CaçambaSP é empresa séria."

QUANDO NÃO SOUBER: Diga que é IA e vai chamar o Douglas. Peça WhatsApp se ainda não tiver. Termine com [ESCALAR].

Uma pergunta por vez. Máximo 3 linhas.${aprendizadosTexto()}`;
}

let history = [];
let situacao = null;
let aguardandoWpp = false;
let cidadeDetectada = null;
let pedidoFechado = false;
let conversaSalva = false;
let clienteNome = null;
let clienteWhatsApp = null;
let conversaId = null;

const el = id => document.getElementById(id);
const scrollDown = () => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

function addMsg(text, role) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  el('messages').appendChild(d);
  scrollDown();
}

function showTyping() {
  const t = document.createElement('div');
  t.className = 'typing'; t.id = 'typing';
  t.innerHTML = '<span></span><span></span><span></span>';
  el('messages').appendChild(t);
  scrollDown();
}
function removeTyping() { const t = el('typing'); if(t) t.remove(); }

function showCadastroBtn() {
  pedidoFechado = true;
  const btn = document.createElement('button');
  btn.className = 'cadastro-btn';
  btn.textContent = '✔ Preencher cadastro e confirmar pedido';
  btn.onclick = () => {
    salvarConversa(true);
    window.open(CADASTRO, '_blank');
  };
  el('messages').appendChild(btn);
  const note = document.createElement('div');
  note.className = 'footer-note';
  note.textContent = 'Rápido e seguro — menos de 1 minuto';
  el('messages').appendChild(note);
  scrollDown();
  salvarConversa(true);
}

function showDouglasBtn(wpp, sit) {
  const b1 = document.createElement('button');
  b1.className = 'douglas-btn';
  b1.textContent = '👨‍💼 Falar com Douglas (gerente)';
  b1.onclick = () => {
    const msg = encodeURIComponent(`*JUCA — ${EMPRESA}*\nCliente: ${wpp}\nSituação: ${sit}\n\nEntrar na conversa.`);
    window.open(`https://wa.me/${DOUGLAS}?text=${msg}`, '_blank');
  };
  el('messages').appendChild(b1);

  if (isAdmin) {
    const b2 = document.createElement('button');
    b2.className = 'aprender-link visivel';
    b2.textContent = '📚 Ensinar o JUCA como resolver isso';
    b2.onclick = () => { situacao = sit; abrirAprender(); };
    el('messages').appendChild(b2);
  }
  scrollDown();
}

function abrirAprender() { el('aprender-txt').value = ''; el('aprender-modal').classList.add('open'); }
function fecharAprender() { el('aprender-modal').classList.remove('open'); }
function salvarAprendizado() {
  const txt = el('aprender-txt').value.trim();
  if (!txt) return;
  const l = getAprendizados();
  l.push(`[${situacao||'geral'}] ${txt}`);
  setAprendizados(l);
  fecharAprender();
  addMsg('✅ Ensinamento salvo! Usarei nas próximas conversas.', 'sistema');
}

/* ── Salvar conversa no Supabase ── */
async function salvarConversa(fechado = false) {
  if (history.length < 2) return;
  if (!conversaId) conversaId = crypto.randomUUID();
  try {
    await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        salvar: true,
        conversa_id: conversaId,
        messages: history,
        cidade: cidadeDetectada,
        pedido_fechado: fechado,
        whatsapp: clienteWhatsApp,
        nome: clienteNome
      })
    });
    conversaSalva = true;
  } catch(e) {
    console.error('Erro ao salvar:', e);
  }
}

/* ── Detectar cidade na conversa ── */
function detectarCidade(texto) {
  const t = texto.toLowerCase();
  if (t.includes('osasco')) return 'Osasco';
  if (t.includes('carapicuíba') || t.includes('carapicuiba')) return 'Carapicuíba';
  if (t.includes('barueri')) return 'Barueri';
  if (t.includes('zona leste') || t.includes('perus') || t.includes('pirituba')) return 'SP Zona Leste';
  if (t.includes('zona norte') || t.includes('zona sul') || t.includes('zona oeste')) return 'SP Zona Norte/Sul';
  if (t.includes('são paulo') || t.includes('sao paulo')) return 'São Paulo';
  return null;
}

/* ── Chamada à API ── */
async function chamar(userMsg) {
  if (aguardandoWpp && /\d{8,}/.test(userMsg.replace(/\D/g,''))) {
    aguardandoWpp = false;
    const wpp = userMsg.replace(/\D/g,'');
    clienteWhatsApp = wpp;
    addMsg('📲 Obrigado! Notificando o Douglas agora...', 'sistema');
    showDouglasBtn(wpp, situacao);
    salvarConversa(false);
    return;
  }

  /* Capturar WhatsApp automaticamente quando aparecer número na conversa */
  if (!clienteWhatsApp && history.length > 2) {
    const nums = userMsg.replace(/\D/g,'');
    if (nums.length >= 10) clienteWhatsApp = nums;
  }

  /* Capturar nome — primeira mensagem do usuário é o nome */
  if (!clienteNome && history.filter(m=>m.role==='user').length === 0) {
    clienteNome = userMsg.trim();
  }

  const cidade = detectarCidade(userMsg);
  if (cidade) cidadeDetectada = cidade;

  history.push({ role: 'user', content: userMsg });
  showTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history, system: buildSystem() })
    });

    if (!res.ok) {
      const err = await res.text();
      removeTyping();
      addMsg(`Erro ${res.status} — ${err.substring(0,120)}`, 'erro');
      return;
    }

    const data = await res.json();
    if (data.error) {
      removeTyping();
      addMsg(`API: ${data.error.message || JSON.stringify(data.error)}`, 'erro');
      return;
    }

    let reply = data.content?.[0]?.text || 'Pode repetir?';
    const escalar = reply.includes('[ESCALAR]');
    reply = reply.replace('[ESCALAR]', '').trim();

    const cidadeReply = detectarCidade(reply);
    if (cidadeReply) cidadeDetectada = cidadeReply;

    history.push({ role: 'assistant', content: reply });
    removeTyping();
    addMsg(reply, 'bot');

    if (escalar) {
      situacao = userMsg;
      aguardandoWpp = true;
      setTimeout(() => {
        const msg = 'Para o Douglas entrar em contato, pode me passar seu WhatsApp com DDD?';
        addMsg(msg, 'bot');
        history.push({ role: 'assistant', content: msg });
      }, 500);
    } else if (reply.toLowerCase().includes('cadastro')) {
      setTimeout(showCadastroBtn, 700);
    }

    /* Salvar a cada 4 mensagens */
    if (history.length % 4 === 0) salvarConversa(false);

  } catch(e) {
    removeTyping();
    addMsg(`Erro de conexão: ${e.message}`, 'erro');
  }
}

function enviar() {
  const msg = el('txt').value.trim();
  if (!msg) return;
  el('txt').value = '';
  addMsg(msg, 'user');
  chamar(msg);
}
el('txt').addEventListener('keydown', e => { if (e.key === 'Enter') enviar(); });

/* Salvar ao fechar a aba */
window.addEventListener('beforeunload', () => salvarConversa(false));

async function iniciar() {
  await new Promise(r => setTimeout(r, 600));
  showTyping();
  await new Promise(r => setTimeout(r, 900));
  removeTyping();
  const intro = `Olá! 👋 Sou o JUCA, assistente de IA da ${EMPRESA}. Para te atender melhor, qual é o seu nome?`;
  addMsg(intro, 'bot');
  history.push({ role: 'assistant', content: intro });
}

iniciar();
</script>
</body>
</html>
